<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Indigo background -->
  <rect width="512" height="512" rx="96" fill="#4338CA"/>

  <!-- Folder body: large, bold, left-center -->
  <rect x="44" y="192" width="316" height="238" rx="24" fill="white"/>
  <!-- Folder tab (top-left flap) -->
  <path d="M44 192 L44 154 Q44 130 68 130 L182 130 Q204 130 214 152 L242 192 Z" fill="white"/>
  <!-- Document lines inside folder -->
  <rect x="76" y="248" width="144" height="16" rx="8" fill="#C7D2FE"/>
  <rect x="76" y="278" width="112" height="16" rx="8" fill="#C7D2FE"/>
  <rect x="76" y="308" width="130" height="16" rx="8" fill="#C7D2FE"/>

  <!-- Amber sync-arrow badge, bottom-right -->
  <circle cx="368" cy="352" r="100" fill="#F59E0B"/>
  <!-- Circular arc (~300 deg, clockwise) -->
  <path d="M368 284 A68 68 0 1 1 308 394"
        stroke="#1E1B4B" stroke-width="34" stroke-linecap="round" fill="none"/>
  <!-- Arrowhead at arc end -->
  <path d="M282 374 L308 406 L336 378 Z" fill="#1E1B4B"/>
</svg>
